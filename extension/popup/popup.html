<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>投上岸助手</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 14px;
      line-height: 1.5;
      color: #333;
      background: #f5f5f5;
      min-width: 280px;
      max-width: 320px;
    }
    
    .header {
      background: linear-gradient(135deg, #22d3ee, #06b6d4);
      color: white;
      padding: 16px;
      text-align: center;
    }
    
    .header h1 {
      font-size: 18px;
      font-weight: 600;
      margin-bottom: 4px;
    }
    
    .header .version {
      font-size: 12px;
      opacity: 0.8;
    }
    
    .content {
      padding: 16px;
    }
    
    .status-section {
      margin-bottom: 16px;
    }
    
    .status-section h2 {
      font-size: 13px;
      color: #666;
      margin-bottom: 8px;
      font-weight: 500;
    }
    
    .status-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 12px;
      background: white;
      border-radius: 6px;
      margin-bottom: 6px;
      border: 1px solid #e5e5e5;
    }
    
    .status-item .label {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    
    .status-item .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #ccc;
    }
    
    .status-item .dot.connected {
      background: #22c55e;
    }
    
    .status-item .dot.disconnected {
      background: #ef4444;
    }
    
    .status-item .value {
      font-size: 12px;
      color: #888;
    }
    
    .platforms {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
    }
    
    .platform-card {
      background: white;
      border-radius: 6px;
      padding: 12px;
      text-align: center;
      border: 1px solid #e5e5e5;
    }
    
    .platform-card.active {
      border-color: #22d3ee;
      background: linear-gradient(135deg, rgba(34, 211, 238, 0.1), white);
    }
    
    .platform-card .name {
      font-weight: 500;
      margin-bottom: 4px;
    }
    
    .platform-card .status {
      font-size: 11px;
      color: #888;
    }
    
    .platform-card.active .status {
      color: #22d3ee;
    }
    
    .actions {
      display: flex;
      gap: 8px;
      margin-top: 16px;
    }
    
    .btn {
      flex: 1;
      padding: 10px;
      border: none;
      border-radius: 6px;
      font-size: 13px;
      cursor: pointer;
      transition: all 0.2s;
    }
    
    .btn-primary {
      background: #22d3ee;
      color: white;
    }
    
    .btn-primary:hover {
      background: #06b6d4;
    }
    
    .btn-secondary {
      background: white;
      color: #333;
      border: 1px solid #e5e5e5;
    }
    
    .btn-secondary:hover {
      background: #f5f5f5;
    }
    
    .footer {
      margin-top: 16px;
      padding-top: 12px;
      border-top: 1px solid #e5e5e5;
      text-align: center;
      font-size: 11px;
      color: #888;
    }
    
    .error {
      background: #fef2f2;
      color: #dc2626;
      padding: 10px;
      border-radius: 6px;
      font-size: 12px;
      margin-bottom: 12px;
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>投上岸助手</h1>
    <div class="version">v1.0.0</div>
  </div>
  
  <div class="content">
    <div id="connectionStatus" class="error" style="display: none;">
      未连接到桌面客户端，请先启动投上岸.exe
    </div>
    
    <div class="status-section">
      <h2>连接状态</h2>
      <div class="status-item">
        <div class="label">
          <span id="wsDot" class="dot disconnected"></span>
          <span>桌面客户端</span>
        </div>
        <span id="wsStatus" class="value">未连接</span>
      </div>
    </div>
    
    <div class="status-section">
      <h2>平台状态</h2>
      <div class="platforms">
        <div id="bossCard" class="platform-card">
          <div class="name">BOSS直聘</div>
          <div class="status">未就绪</div>
        </div>
        <div id="liepinCard" class="platform-card">
          <div class="name">猎聘</div>
          <div class="status">未就绪</div>
        </div>
        <div id="zhilianCard" class="platform-card">
          <div class="name">智联招聘</div>
          <div class="status">未就绪</div>
        </div>
        <div id="qianchengCard" class="platform-card">
          <div class="name">前程无忧</div>
          <div class="status">未就绪</div>
        </div>
      </div>
    </div>
    
    <div class="actions">
      <button class="btn btn-primary" id="refreshBtn">刷新状态</button>
      <button class="btn btn-secondary" id="openClientBtn">打开客户端</button>
    </div>
  </div>
  
  <div class="footer">
    请先打开招聘网站并登录<br>
    然后在客户端中执行搜索和投递
  </div>
  
  <script src="popup.js"></script>
</body>
</html>
